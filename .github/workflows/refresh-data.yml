name: Weekly data refresh

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC (deploys ~02:40 UTC, off-peak) — the quiz
                          # schedule extends from the refreshed dataset before deployment
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      full_refresh:
        description: Ignore incremental state and fetch every player
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit the refreshed dataset
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install requests==2.32.3

      # Only state produced by a code-compatible, fully successful earlier run is
      # allowed to suppress source fetches. A new pipeline hash starts cold.
      - uses: actions/cache/restore@v4
        with:
          path: data/state
          key: refresh-state-v1-${{ hashFiles('pipeline/pipeline.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: refresh-state-v1-${{ hashFiles('pipeline/pipeline.py') }}-

      # re-runs of a failed job resume its checkpoints; keys are scoped to the
      # run id, so a new weekly run always starts from a clean fetch
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: checkpoints-${{ github.run_id }}-

      # the validate stage aborts the job (no commit, no deploy) if the new
      # index is malformed or shrank >3% vs the currently deployed one
      - name: Refresh dataset from Wikidata + Wikipedia (revision-aware after first run)
        env:
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
        run: |
          git show HEAD:site/data/index.json > /tmp/index-baseline.json
          VALIDATE_BASELINE=/tmp/index-baseline.json python3 pipeline/pipeline.py

      - name: Test pipeline and audit quiz schedule
        run: |
          python3 -m unittest discover -s tests
          node --test --test-concurrency=1 tests/quiz-core.test.js tests/quiz-schedule.test.js

      - uses: actions/cache/save@v4
        with:
          path: data/state
          key: refresh-state-v1-${{ hashFiles('pipeline/pipeline.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/cache/save@v4
        if: always()   # keep partial checkpoints even when a stage failed
        with:
          path: data
          key: checkpoints-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit refreshed dataset if it changed
        run: |
          git config user.name "istintopuro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No dataset changes this week."
          else
            # validate writes the body: counts and coverage, none of which can be read
            # back out of a one-line minified index.json diff
            # two -m give subject then body; no heredoc, whose closing marker would have
            # to sit at column 0 and so would end this YAML block scalar early
            if [ -f data/commit-body.txt ]; then
              git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))" -m "$(cat data/commit-body.txt)"
            else
              git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))"
            fi
            git push origin HEAD:master
          fi

      # code assets are unchanged by a data refresh, so reuse the trigger SHA
      - name: Stamp asset version
        run: sed -i "s/__V__/${GITHUB_SHA}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
