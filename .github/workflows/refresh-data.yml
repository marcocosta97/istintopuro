name: Weekly data refresh

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC (deploys ~02:40 UTC, off-peak) — the quiz
                          # schedule extends from the refreshed dataset before deployment
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      full_refresh:
        description: Ignore incremental state and fetch every player
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # commit the refreshed dataset
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python3 -m pip install --retries 10 --timeout 30 requests==2.32.3

      # Only state produced by a schema-compatible, fully successful earlier run is
      # allowed to suppress source fetches. Bump v1 with pipeline.CACHE_VERSION.
      - uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: data/state
          key: refresh-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: refresh-state-v1-

      # re-runs of a failed job resume its checkpoints; keys are scoped to the
      # run id, so a new weekly run always starts from a clean fetch
      - uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: data
          key: checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: checkpoints-${{ github.run_id }}-

      # the validate stage rejects the candidate if the new index is malformed or
      # shrank >3% vs the deployed one; the recovery step below retains the baseline
      - name: Refresh dataset from Wikidata + Wikipedia (revision-aware after first run)
        id: refresh
        continue-on-error: true
        env:
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
        run: |
          git show HEAD:site/data/index.json > /tmp/index-baseline.json
          mkdir -p /tmp/pack-baselines
          for pack in site/data/packs/*; do
            [ -f "$pack/index.json" ] || continue
            cp "$pack/index.json" "/tmp/pack-baselines/$(basename "$pack").json"
          done
          VALIDATE_BASELINE=/tmp/index-baseline.json VALIDATE_PACK_BASELINE_DIR=/tmp/pack-baselines python3 pipeline/pipeline.py

      # Remote APIs and community-edited source data can fail independently of this
      # repository. Keep the last validated dataset in that case, while leaving the
      # failed refresh step and a job summary as visible diagnostics.
      - name: Keep the last validated dataset after a refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          git restore --source=HEAD --staged --worktree site/data
          git clean -fd -- site/data
          echo "### Weekly data refresh warning" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "The refresh or validation failed. The last validated dataset was retained and deployed; inspect the refresh step log for the upstream error." >> "$GITHUB_STEP_SUMMARY"

      - name: Test pipeline and audit quiz schedule
        run: |
          python3 -m unittest discover -s tests
          node --test --test-concurrency=1 tests/packs.test.js tests/quiz-core.test.js tests/quiz-schedule.test.js

      - uses: actions/cache/save@v6
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        with:
          path: data/state
          key: refresh-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/cache/save@v6
        if: always()   # keep partial checkpoints even when a stage failed
        continue-on-error: true
        with:
          path: data
          key: checkpoints-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit refreshed dataset if it changed
        run: |
          git config user.name "istintopuro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No dataset changes this week."
          else
            # validate writes the body: counts and coverage, none of which can be read
            # back out of a one-line minified index.json diff
            # two -m give subject then body; no heredoc, whose closing marker would have
            # to sit at column 0 and so would end this YAML block scalar early
            if [ -f data/commit-body.txt ]; then
              git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))" -m "$(cat data/commit-body.txt)"
            else
              git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))"
            fi
            git push origin HEAD:master
          fi

      # A refresh commit changes the positional index and shards together. Stamp the
      # deployed HEAD so an older cached index can never address the refreshed shards.
      - name: Stamp asset version
        run: sed -i "s/__V__/$(git rev-parse HEAD)/g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
