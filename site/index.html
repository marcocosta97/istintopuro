<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

</head>
<body>
<header>
  <div class="mast">
    <h1><span>Istinto</span> <span class="accent">Puro</span></h1>
    <div class="htools">
      <button id="themebtn" type="button" aria-label="theme"></button>
      <button id="aboutbtn" type="button" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 0 0 2.572-1.065z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <select id="langsel" aria-label="Lingua / Language">
        <option value="it">IT</option><option value="en">EN</option>
      </select>
    </div>
  </div>
  <p class="sub" id="tagline">Scegli squadre, campionati o paesi — chi li unisce?</p>
</header>
<main>
  <div id="modebar" role="group" aria-label="Modalità principale">
    <button id="mode-quiz" type="button" aria-pressed="false">Quiz</button>
    <button id="mode-club" type="button" aria-pressed="true">Squadre</button>
    <button id="mode-player" type="button" aria-pressed="false">Giocatori</button>
  </div>
  <section id="quiz"></section>
  <div id="packhint" hidden>
    <span id="packhinttext"></span>
    <button id="packhintopen" type="button"></button>
    <button id="packhintdismiss" type="button">×</button>
  </div>
  <div id="picker">
    <div id="chips"></div>
    <div id="searchwrap">
      <input id="search" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list"
             enterkeyhint="search" placeholder="Aggiungi squadra, campionato o paese…" disabled>
      <button id="randbtn" type="button" disabled hidden>🎲</button>
      <button id="browsebtn" type="button" aria-controls="browse" aria-expanded="false" disabled>▾</button>
      <ul id="suggestions" role="listbox" hidden></ul>
    </div>
    <div id="browse" hidden>
      <button id="br-back" type="button" hidden>‹</button>
      <ul></ul><ul></ul><ul></ul>
    </div>
  </div>
  <div id="controls">
    <span class="fgrp">
      <button id="advtoggle" type="button" aria-controls="advbody" aria-expanded="false"><span
        id="l-adv">Filtri</span><span id="advcount"></span></button>
      <button id="filtreset" type="button" hidden></button>
    </span>
    <span class="ctl"><label id="l-sort" for="sortsel">Ordina per</label>
      <select id="sortsel">
        <option value="apps">presenze</option>
        <option value="goals">gol</option>
        <option value="birth">nascita</option>
        <option value="mates" hidden>insieme</option>
      </select><button id="dirbtn" aria-label="direzione">↓</button></span>
  </div>
  <div id="advbody" hidden>
    <div id="frows">
      <div class="frow" id="natctl">
        <span id="l-nat">Nazionalità</span>
        <button id="nattoggle" type="button" aria-controls="natpanel" aria-expanded="false" disabled><span
          id="natcount"></span></button>
        <div id="natpanel" hidden>
          <div id="natacts"><button id="natall" type="button">tutte</button><button
            id="natnone" type="button">nessuna</button></div>
          <ul id="natlist"></ul>
        </div>
      </div>
      <div class="frow">
        <label id="l-born" for="byfrom">Nati</label>
        <span class="fctl"><input id="byfrom" type="number" min="1850" max="2035" placeholder="dal">–<input
         id="byto" type="number" min="1850" max="2035" placeholder="al"></span>
      </div>
      <label class="frow" for="nozero">
        <span class="flab"><span id="l-nozero">Nascondi 0 presenze</span>
          <button class="hint" id="hint-nozero" type="button" aria-expanded="false">?<span class="tip" id="tip-nozero"></span></button>
        </span>
        <span class="dtg"><input id="nozero" type="checkbox"><span class="knob"></span></span>
      </label>
    </div>
  </div>
  <div id="status" aria-live="polite">Caricamento dati…</div>
  <ul id="results"></ul>
</main>
<dialog id="about">
  <h2>Istinto Puro — quiz & solver</h2>
  <p id="abouttext"></p>
  <p id="aboutleagues"></p>
  <section id="aboutpacks" hidden>
    <h3 id="packstitle"></h3>
    <p id="packsnote"></p>
    <p id="packsrequired" role="status" hidden></p>
    <div id="packslist"></div>
  </section>
  <p id="aboutdisclaimer" class="disclaimer"></p>
  <form method="dialog"><button>OK</button></form>
</dialog>
<footer id="foot">dati: <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a> · foto: <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> · <a href="https://github.com/marcocosta97/istintopuro/blob/master/LICENSE" target="_blank" rel="noopener">MIT</a> · <a href="https://github.com/marcocosta97/istintopuro" target="_blank" rel="noopener">GitHub</a></footer>
<script src="packs.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
<script src="quiz-core.js?v=__V__"></script>
<script src="quiz.js?v=__V__"></script>
</body>
</html>
